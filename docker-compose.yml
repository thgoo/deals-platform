# Local infrastructure only. MariaDB stays until the Postgres cutover (phase 5). The apps run natively with `bun` (hot reload, easy debugging).
#
#   docker compose up -d        # start
#   docker compose down         # stop (data is kept in the named volume)
#   docker compose down -v      # stop and wipe the database

services:
  mariadb:
    # Same engine and major version as production (MariaDB 10.11 LTS).
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: deals
      MARIADB_USER: deals
      MARIADB_PASSWORD: deals
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # The prod dump has large multi-row INSERTs (products carry 1536-dim embeddings).
      - --max-allowed-packet=512M
      - --innodb-buffer-pool-size=1G
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    # Same image as production (pgvector on Postgres 18). 18 is required for LIKE
    # on the case/accent-insensitive ICU collation the text columns use.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: deals
      POSTGRES_PASSWORD: deals
      POSTGRES_DB: deals
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deals -d deals"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb-data:
  postgres-data:
